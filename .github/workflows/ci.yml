name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      - run: ruff check . --output-format=github

  test:
    name: Unit + end-to-end tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Pytest
        run: pytest --cov=bikecast --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: coverage
          path: coverage.xml

  spark-sql:
    name: Databricks SQL on local Spark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev,spark]"
      - name: Spark SQL tests (same SQL as the notebooks, compared with pandas)
        run: pytest tests/test_spark_sql.py -m spark -v

  pipeline-smoke:
    name: Full pipeline on synthetic data
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e .
      - name: Run bronze -> silver -> gold -> segmentation -> tuning -> backtest -> report
        run: python -m bikecast.run_local --synthetic --data-dir data/ci --figures-dir data/ci/figures --n-jobs 2
      - name: Check outputs
        run: |
          test -f data/ci/outputs/results.md
          test "$(ls data/ci/figures/*.png | wc -l)" -eq 6
          cat data/ci/outputs/results.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-pipeline-outputs
          path: |
            data/ci/outputs/results.md
            data/ci/outputs/results.json
            data/ci/figures/

  bundle-validate:
    name: Validate Databricks bundle
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check YAML syntax
        run: pip install pyyaml && python -c "import yaml,sys; yaml.safe_load(open('databricks.yml')); print('databricks.yml OK')"
      - uses: databricks/setup-cli@main
        if: env.DATABRICKS_HOST != '' && env.DATABRICKS_TOKEN != ''
      - name: databricks bundle validate
        if: env.DATABRICKS_HOST != '' && env.DATABRICKS_TOKEN != ''
        run: databricks bundle validate -t dev
      - name: Skipped (no Databricks secrets)
        if: env.DATABRICKS_HOST == '' || env.DATABRICKS_TOKEN == ''
        run: echo "::notice::DATABRICKS_HOST / DATABRICKS_TOKEN secrets not set - only YAML syntax was checked."
